name: Security

# §8.1: secrets scanning (gitleaks) and dependency audit on every PR and push,
# plus a weekly run so newly published advisories surface without a code change.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed in a later commit is still leaked.
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Production dependencies only; high and critical advisories fail the build.
      - name: pnpm audit
        run: pnpm audit --prod --audit-level high

  images:
    # The Dockerfiles are part of the release: make sure they still build.
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f infra/docker/backend.Dockerfile -t sitereel-backend:${{ github.sha }} .
      - name: Build worker image
        run: docker build -f infra/docker/worker.Dockerfile -t sitereel-worker:${{ github.sha }} .
